name: Release

# Builds the supported prebuilt targets, verifies the source, and publishes a
# GitHub Release with `lynx-vX.Y.Z-<os>-<arch>.tar.gz` archives plus a
# `SHA256SUMS` manifest that `install.sh` verifies before installing.
#
# Only a tag whose version matches the workspace `[workspace.package] version`
# produces a release; see the `version-guard` job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: fmt / check / clippy / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  version-guard:
    name: tag matches workspace version
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Check tag == workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "tag=$tag workspace-version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match workspace version $version"
            exit 1
          fi

  build:
    name: build ${{ matrix.platform }}
    needs: [verify, version-guard]
    # `version-guard` is skipped on workflow_dispatch; allow the build then.
    if: ${{ always() && (needs.verify.result == 'success') && (needs.version-guard.result == 'success' || needs.version-guard.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon (arm64)
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - runner: macos-15-intel    # Intel (x86_64)
            target: x86_64-apple-darwin
            platform: darwin-x86_64
          - runner: ubuntu-24.04      # x86_64
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm  # arm64 (public repos / arm64 runners)
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p pizen-lynx --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-dev}"
          asset="lynx-${tag}-${{ matrix.platform }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lx" dist/lx
          chmod 0755 dist/lx
          tar -czf "$asset" -C dist lx
          rm -f dist/lx
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Smoke-test the binary (native)
        shell: bash
        run: |
          set -euo pipefail
          ./target/${{ matrix.target }}/release/lx --version
          ./target/${{ matrix.target }}/release/lx mcp --check
      - name: Clean-machine validation (native)
        shell: bash
        run: |
          set -euo pipefail
          tests/distribution/clean_machine_test.sh "target/${{ matrix.target }}/release/lx"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum lynx-*.tar.gz > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "Lynx ${tag}" \
            --notes "Prebuilt binaries for ${tag}. Verify the SHA256SUMS manifest before installing. See docs/architecture/mcp-compatibility.md for MCP setup." \
            dist/lynx-*.tar.gz dist/SHA256SUMS
