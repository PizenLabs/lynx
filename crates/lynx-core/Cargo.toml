[package]
name = "pizen-lynx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/pizen-lynx-core"

# Internal implementation crate: published to crates.io so that
# `cargo install pizen-lynx` resolves, but NOT a stable public API.
description = "Internal engine for Lynx: discovery, indexing, retrieval, ranking, and context."

[dependencies]
blake3 = "1.8.5"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
walkdir = "2.5.0"

lynx-embed.workspace = true
lynx-parser.workspace = true
lynx-protocol.workspace = true
lynx-storage.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
