[package]
name = "pizen-lynx-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/pizen-lynx-mcp"

# Internal implementation crate (published only to satisfy Cargo; not a public API).
# The canonical MCP entrypoint is `lx mcp`; the binary is an auxiliary,
# undeclared entrypoint and is not part of the product surface.
description = "Internal Model Context Protocol implementation for Lynx (canonical entrypoint: `lx mcp`)."

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.27.0"

lynx-core.workspace = true
lynx-embed.workspace = true
lynx-protocol.workspace = true
